<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗺️ 地圖手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --cream:#FFF6E8; --cream-deep:#FBE9CC;
    --leaf:#3E9166; --leaf-deep:#276148; --ink:#2B4636;
    --pink:#FF7FA8; --pink-deep:#E85D8D; --pink-bg:#FFEDF3;
    --mush:#E0A438; --mush-deep:#B9820A; --mush-bg:#FFF6DC;
    --purple:#B080E0; --purple-deep:#6B4A9A; --purple-bg:#F5F0FA;
    --white:#FFFFFF;
    --card-shadow: 0 6px 0 rgba(39,97,72,0.14);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; font-family:"Zen Maru Gothic","Noto Sans TC",sans-serif;
    background:
      radial-gradient(circle at 10% 12%, rgba(255,201,60,0.18), transparent 40%),
      radial-gradient(circle at 92% 8%, rgba(255,127,168,0.16), transparent 45%),
      radial-gradient(circle at 50% 95%, rgba(95,193,222,0.15), transparent 40%),
      var(--cream);
    color:var(--ink); min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }

  /* ---------- password gate ---------- */
  .pw-overlay{
    position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 10% 12%, rgba(255,201,60,0.18), transparent 40%),
      radial-gradient(circle at 92% 8%, rgba(255,127,168,0.16), transparent 45%),
      var(--cream);
    padding:20px;
  }
  .pw-box{
    background:var(--white); border-radius:24px; padding:34px 30px; max-width:320px; width:100%;
    text-align:center; box-shadow:0 10px 0 rgba(39,97,72,.18);
  }
  .pw-box .emoji{ font-size:42px; }
  .pw-box h2{ font-family:"Baloo 2",sans-serif; color:var(--leaf-deep); margin:6px 0 4px; font-size:21px; }
  .pw-box p{ font-size:13px; color:#7C9686; margin:0 0 18px; }
  .pw-box input{
    width:100%; text-align:center; letter-spacing:6px; font-family:"Baloo 2",monospace; font-size:19px;
    padding:11px 12px; border-radius:14px; border:2px solid #D9E8DD; outline:none; margin-bottom:8px;
  }
  .pw-box input:focus{ border-color:var(--leaf); }
  .pw-err{ color:#D8464E; font-size:12px; font-weight:700; min-height:16px; margin-bottom:8px; }
  .pw-err.shake{ animation:shake .35s; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  .app-root{ display:none; }

  /* ---------- decorative drifting icons ---------- */
  .drift{ position:fixed; pointer-events:none; z-index:0; opacity:.5; animation:drift 9s ease-in-out infinite; font-size:clamp(20px,3vw,30px); }
  .drift.d1{ top:8%; left:3%; animation-delay:0s; } .drift.d2{ top:70%; left:2%; animation-delay:1.5s; }
  .drift.d3{ top:18%; right:4%; animation-delay:.7s; } .drift.d4{ top:78%; right:5%; animation-delay:2.2s; }
  @keyframes drift{ 0%,100%{ transform:translateY(0) rotate(-4deg);} 50%{ transform:translateY(-20px) rotate(6deg);} }

  .wrap{ position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:20px 20px 90px; }

  /* ---------- account bar ---------- */
  .account-bar{ display:flex; justify-content:flex-end; align-items:center; gap:10px; min-height:36px; margin-bottom:6px; }
  .account-chip{
    display:flex; align-items:center; gap:8px; background:var(--white); border-radius:999px; padding:5px 14px 5px 6px;
    box-shadow:0 3px 0 rgba(43,70,54,.12); font-size:12.5px; font-weight:700; color:var(--ink);
  }
  .account-chip .avatar{ width:24px; height:24px; border-radius:50%; background:var(--leaf); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; }
  .account-chip .admin-tag{ background:var(--mush); color:#fff; font-size:10.5px; padding:2px 8px; border-radius:999px; }
  .account-chip button{ border:none; background:transparent; color:#A6947A; cursor:pointer; font-size:11.5px; font-weight:700; padding:2px; }
  #gsiButton{ display:inline-block; }

  .bloom-strip{ display:flex; justify-content:center; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
  .bloom-strip span{ display:inline-block; font-size:clamp(17px,2.3vw,24px); transform:scale(0); animation:bloom-pop .6s cubic-bezier(.34,1.56,.64,1) forwards; }
  .bloom-strip span:nth-child(1){animation-delay:.05s;} .bloom-strip span:nth-child(2){animation-delay:.15s;}
  .bloom-strip span:nth-child(3){animation-delay:.25s;} .bloom-strip span:nth-child(4){animation-delay:.35s;}
  .bloom-strip span:nth-child(5){animation-delay:.45s;}
  @keyframes bloom-pop{ 0%{transform:scale(0) rotate(-30deg); opacity:0;} 70%{transform:scale(1.25) rotate(8deg); opacity:1;} 100%{transform:scale(1) rotate(0);} }

  header{ text-align:center; margin-bottom:26px; }
  .mascot{ display:inline-block; font-size:44px; margin-bottom:2px; animation:bob 2.4s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0) rotate(-3deg);} 50%{ transform:translateY(-8px) rotate(3deg);} }
  h1{
    font-family:"Baloo 2","Zen Maru Gothic",sans-serif; font-weight:800;
    font-size:clamp(28px,5vw,42px); margin:4px 0 8px; color:var(--leaf-deep); letter-spacing:1px;
    text-shadow:3px 3px 0 var(--white), 3px 3px 0 var(--white);
  }
  header p.sub{ font-size:clamp(13px,1.8vw,15.5px); color:#5C7B6A; margin:0; font-weight:500; }
  .stat-pill{
    display:inline-flex; align-items:center; gap:6px; margin-top:14px; background:var(--white);
    border:2px dashed var(--leaf); color:var(--leaf-deep); padding:7px 18px; border-radius:999px;
    font-size:13px; font-weight:700;
  }
  .backend-hint{ margin-top:8px; font-size:11.5px; color:#A6947A; }

  .controls{ margin:26px 0 22px; display:flex; flex-direction:column; gap:14px; align-items:center; }
  .search-wrap{ position:relative; width:min(480px, 100%); }
  .search-wrap input{
    width:100%; padding:11px 16px 11px 38px; border:2px solid var(--cream-deep); border-radius:999px;
    font-size:14.5px; background:var(--white); color:var(--ink); font-family:"Zen Maru Gothic",sans-serif;
    outline:none; transition:border-color .15s ease;
  }
  .search-wrap input:focus{ border-color:var(--leaf); }
  .search-wrap svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:.45; }

  .filter-bar{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .chip{
    border:none; cursor:pointer; font-family:"Zen Maru Gothic",sans-serif; font-weight:700; font-size:13.5px;
    padding:9px 18px; border-radius:999px; background:var(--white); color:var(--ink);
    box-shadow:0 3px 0 rgba(43,70,54,.15); display:inline-flex; align-items:center; gap:6px;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;
  }
  .chip:hover{ transform:translateY(-2px); } .chip:active{ transform:translateY(1px); }
  .chip.active[data-cat="all"]{ background:var(--leaf); color:#fff; box-shadow:0 3px 0 var(--leaf-deep); }
  .chip.active[data-cat="flower"]{ background:var(--pink); color:#fff; box-shadow:0 3px 0 var(--pink-deep); }
  .chip.active[data-cat="mushroom"]{ background:var(--mush); color:#fff; box-shadow:0 3px 0 var(--mush-deep); }
  .chip.active[data-cat="hidden"]{ background:var(--purple); color:#fff; box-shadow:0 3px 0 var(--purple-deep); }
  .chip.active[data-obt="all"]{ background:var(--ink); color:#fff; box-shadow:0 3px 0 rgba(43,70,54,.35); }
  .chip.active[data-obt="got"]{ background:var(--leaf); color:#fff; box-shadow:0 3px 0 var(--leaf-deep); }
  .chip.active[data-obt="not"]{ background:var(--mush); color:#fff; box-shadow:0 3px 0 var(--mush-deep); }
  .chip.active[data-obt="expired"]{ background:var(--purple); color:#fff; box-shadow:0 3px 0 var(--purple-deep); }

  .add-btn{
    border:none; background:linear-gradient(135deg, var(--leaf), var(--leaf-deep)); color:#fff;
    font-family:"Zen Maru Gothic",sans-serif; font-weight:800; font-size:14.5px; padding:12px 24px;
    border-radius:999px; cursor:pointer; box-shadow:0 4px 0 rgba(39,97,72,.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .add-btn:hover{ transform:translateY(-2px); }
  .add-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(39,97,72,.35); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:20px; }
  .card{
    background:var(--white); border-radius:22px; overflow:hidden; box-shadow:var(--card-shadow);
    border:3px solid rgba(39,97,72,.06); display:flex; flex-direction:column;
    opacity:0; transform:translateY(14px) scale(.97); animation:card-in .45s ease forwards;
    transition:transform .2s ease, box-shadow .2s ease, filter .2s ease, opacity .2s ease;
  }
  .card:hover{ transform:translateY(-4px); box-shadow:0 10px 0 rgba(39,97,72,.14); }
  @keyframes card-in{ to{ opacity:1; transform:translateY(0) scale(1); } }
  .card.status-got{
    border-color: var(--leaf);
    background: linear-gradient(180deg, #EFFAF3 0%, var(--white) 55%);
  }
  .card.status-expired{
    border-color: var(--mush);
    filter: grayscale(45%);
    opacity: .78 !important; /* card-in 進場動畫的 forwards 效果會蓋掉一般的 opacity，這裡要蓋回來 */
  }
  .card.status-expired:hover{ filter: grayscale(15%); opacity: 1 !important; }

  .thumb{ width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:var(--cream-deep); }
  .thumb-empty{
    width:100%; aspect-ratio:4/3; display:flex; align-items:center; justify-content:center;
    background:var(--cream-deep); color:#A6947A; font-size:13px; font-weight:600;
  }
  .card-body{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px; flex:1; }

  .tag-row{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .badge{ font-size:11.5px; font-weight:800; padding:5px 12px; border-radius:999px; color:#fff; }
  .badge.flower{ background:var(--pink); } .badge.mushroom{ background:var(--mush); } .badge.hidden{ background:var(--purple); }
  .country-tag{ font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:999px; background:#EFF7F1; color:var(--leaf-deep); }

  .coord-box{
    display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
    background:var(--cream-deep); border:2px dashed #E3C48F; border-radius:14px; padding:8px 10px 8px 14px;
  }
  .coord-box code{ font-family:"Baloo 2",monospace; font-size:12.5px; color:#7A5A2C; font-weight:600; word-break:break-all; flex:1; min-width:80px; }
  .copy-btn{
    flex-shrink:0; border:none; background:#FFC93C; color:#6B4A00; font-weight:800; font-size:12px;
    padding:7px 12px; border-radius:10px; cursor:pointer; font-family:"Zen Maru Gothic",sans-serif;
    transition:transform .15s ease, background .15s ease; display:flex; align-items:center; gap:4px;
  }
  .copy-btn:hover{ background:#FFD966; transform:translateY(-1px); }
  .copy-btn:active{ transform:translateY(1px) scale(.95); }
  .copy-btn.copied{ background:var(--leaf); color:#fff; }

  .desc{ font-size:13.5px; color:#6B7C71; line-height:1.6; margin:0; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

  .card-footer{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; padding-top:8px; border-top:1px dashed #E5DFD0; gap:6px; flex-wrap:wrap; }
  .obtained-label{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:#8A9A8E; user-select:none; }
  .obtained-label.editable{ cursor:pointer; }
  .obtained-label.on{ color:var(--leaf-deep); }
  .obtained-label input{ accent-color:var(--leaf); width:16px; height:16px; }
  .obtained-label input:not(:disabled){ cursor:pointer; }
  .obtained-label input:disabled{ cursor:not-allowed; opacity:.7; }
  .del-btn{ border:none; background:transparent; color:#C4B8A5; cursor:pointer; font-size:12px; padding:4px; font-family:"Zen Maru Gothic",sans-serif; font-weight:700; }
  .del-btn:hover{ color:#D8464E; }
  .edit-btn{ border:none; background:transparent; color:#8A9A8E; cursor:pointer; font-size:12px; padding:4px; font-family:"Zen Maru Gothic",sans-serif; font-weight:700; }
  .edit-btn:hover{ color:var(--leaf-deep); }

  .empty-state{ grid-column:1/-1; text-align:center; padding:70px 20px; color:#7C9686; }
  .empty-state .emoji{ font-size:40px; display:block; margin-bottom:10px; }
  .empty-state .title{ font-family:"Baloo 2",sans-serif; font-size:19px; color:var(--leaf-deep); margin-bottom:6px; font-weight:700; }

  .overlay{ position:fixed; inset:0; background:rgba(43,70,54,.45); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal{ background:var(--cream); border-radius:24px; width:100%; max-width:440px; max-height:90vh; overflow-y:auto; padding:26px 24px; box-shadow:0 10px 0 rgba(39,97,72,.18); }
  .modal h2{ font-family:"Baloo 2",sans-serif; color:var(--leaf-deep); margin:0 0 4px; font-size:21px; }
  .modal .sub{ margin:0 0 18px; font-size:13px; color:#7C9686; }
  .field{ margin-bottom:15px; }
  .field label{ display:block; font-size:12.5px; font-weight:800; margin-bottom:6px; color:var(--leaf-deep); }
  .field input[type=text], .field textarea{
    width:100%; padding:10px 13px; border:2px solid #D9E8DD; border-radius:12px;
    font-family:"Zen Maru Gothic",sans-serif; font-size:14px; background:var(--white); color:var(--ink); outline:none;
    transition:border-color .15s ease;
  }
  .field input[type=text]:focus, .field textarea:focus{ border-color:var(--leaf); }
  .field textarea{ resize:vertical; min-height:60px; }
  .field .hint{ font-size:11px; color:#A6947A; margin-top:5px; }
  .country-field-row{ display:flex; align-items:center; gap:8px; }
  .country-field-row input{ flex:1; }
  .country-spinner{ font-size:12px; color:#A6947A; flex-shrink:0; display:none; }
  .country-spinner.show{ display:block; }

  .cat-choice{ display:flex; gap:8px; }
  .cat-choice button{
    flex:1; padding:10px 6px; border-radius:12px; border:2px solid #D9E8DD; background:var(--white);
    font-family:"Zen Maru Gothic",sans-serif; font-size:13px; font-weight:700; cursor:pointer; color:#8A9A8E;
    transition:.15s ease;
  }
  .cat-choice button.sel[data-cat="flower"]{ border-color:var(--pink); background:var(--pink-bg); color:var(--pink-deep); }
  .cat-choice button.sel[data-cat="mushroom"]{ border-color:var(--mush); background:var(--mush-bg); color:var(--mush-deep); }
  .cat-choice button.sel[data-cat="hidden"]{ border-color:var(--purple); background:var(--purple-bg); color:var(--purple-deep); }

  .upload-box{
    border:2px dashed #D9E8DD; border-radius:14px; padding:16px; text-align:center; cursor:pointer;
    color:#8A9A8E; font-size:13px; font-weight:600; position:relative; background:var(--white);
  }
  .upload-box img{ max-width:100%; max-height:160px; border-radius:10px; display:block; margin:0 auto; }
  .upload-box input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }

  .recrop-btn{
    display:none; margin-top:8px; border:none; background:#EFF7F1; color:var(--leaf-deep); font-weight:700;
    font-size:12px; padding:6px 12px; border-radius:999px; cursor:pointer; font-family:"Zen Maru Gothic",sans-serif;
  }
  .recrop-btn:hover{ background:#D9EFE0; }

  .crop-stage{ margin-top:8px; }
  .crop-wrap{
    position:relative; width:100%; overflow:hidden; border-radius:14px; background:#20241f; touch-action:none;
  }
  .crop-wrap img{ display:block; width:100%; height:auto; pointer-events:none; -webkit-user-drag:none; user-select:none; }
  .crop-box{
    position:absolute; border:2px solid #FFC93C; box-shadow:0 0 0 9999px rgba(0,0,0,.5);
    touch-action:none; cursor:move;
  }
  .crop-handle{
    position:absolute; width:16px; height:16px; background:#FFC93C; border:2px solid #fff; border-radius:50%;
    touch-action:none;
  }
  .crop-handle[data-corner="nw"]{ top:-9px; left:-9px; cursor:nwse-resize; }
  .crop-handle[data-corner="ne"]{ top:-9px; right:-9px; cursor:nesw-resize; }
  .crop-handle[data-corner="sw"]{ bottom:-9px; left:-9px; cursor:nesw-resize; }
  .crop-handle[data-corner="se"]{ bottom:-9px; right:-9px; cursor:nwse-resize; }
  .crop-actions{ display:flex; gap:8px; margin-top:10px; }
  .crop-actions .btn{ padding:9px; font-size:13px; }
  .crop-hint{ font-size:11px; color:#A6947A; margin-top:6px; }

  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .btn{ flex:1; padding:12px; border-radius:14px; border:none; font-family:"Zen Maru Gothic",sans-serif; font-size:14.5px; font-weight:800; cursor:pointer; transition:transform .15s ease; }
  .btn.primary{ background:var(--leaf); color:#fff; box-shadow:0 3px 0 var(--leaf-deep); }
  .btn.primary:hover{ transform:translateY(-1px); }
  .btn.primary:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--leaf-deep); }
  .btn.primary:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
  .btn.ghost{ background:#EFEAE0; color:#6B7C71; }
  .btn.ghost:active{ transform:scale(.96); }
  .err{ color:#D8464E; font-size:12px; font-weight:700; margin-top:6px; min-height:16px; }
  .keyword-toggle{
    display:flex; align-items:center; gap:6px; background:none; border:none; cursor:pointer;
    font-size:12.5px; font-weight:800; color:var(--leaf-deep); padding:6px 0; font-family:"Zen Maru Gothic",sans-serif;
  }
  .keyword-panel{
    margin-top:6px; max-height:220px; overflow-y:auto; border:1.5px solid #D9E8DD; border-radius:12px;
    padding:10px 12px; background:var(--white);
  }
  .keyword-group{ margin-bottom:10px; }
  .keyword-group:last-child{ margin-bottom:0; }
  .keyword-group-label{ font-size:11px; font-weight:800; color:#A6947A; margin-bottom:6px; }
  .keyword-chip{
    display:inline-block; margin:0 5px 5px 0; padding:5px 11px; border-radius:999px;
    background:#EFF7F1; color:var(--leaf-deep); font-size:12px; font-weight:700; border:none; cursor:pointer;
    font-family:"Zen Maru Gothic",sans-serif; transition:background .15s ease, color .15s ease;
  }
  .keyword-chip:hover{ background:#D9EFE0; }
  .keyword-chip.selected{ background:var(--leaf); color:#fff; }
  .draft-banner{
    background:#FFF6DC; border:1.5px dashed var(--mush); border-radius:12px; padding:10px 12px;
    font-size:12.5px; color:#8A6A1E; margin-bottom:14px; display:flex; align-items:center;
    justify-content:space-between; gap:8px; flex-wrap:wrap;
  }
  .draft-banner button{
    border:none; background:transparent; color:var(--leaf-deep); font-weight:800; font-size:12px;
    cursor:pointer; font-family:"Zen Maru Gothic",sans-serif; text-decoration:underline;
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--leaf-deep); color:#fff; padding:10px 20px; border-radius:999px; font-size:13.5px;
    font-weight:700; opacity:0; pointer-events:none; transition:.2s ease; z-index:80; font-family:"Zen Maru Gothic",sans-serif;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .loading{ text-align:center; padding:100px 20px; color:#7C9686; font-weight:600; }
</style>
</head>
<body>

<!-- ---------- back to index ---------- -->
<a href="index.html" style="
  position:fixed; top:16px; left:16px; z-index:200;
  display:inline-flex; align-items:center; gap:6px;
  background:#3E9166; color:#fff; text-decoration:none;
  font-family:'Zen Maru Gothic','Noto Sans TC',sans-serif; font-weight:700; font-size:13.5px;
  padding:9px 16px; border-radius:999px; box-shadow:0 3px 0 #276148;
  transition:transform .15s ease, box-shadow .15s ease;
" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">← 回首頁</a>

<!-- ---------- password gate ---------- -->
<div class="pw-overlay" id="pwOverlay">
  <div class="pw-box">
    <div class="emoji">🔒</div>
    <h2>地圖手帳</h2>
    <p>請輸入通關密碼</p>
    <input type="password" id="pwInput" inputmode="numeric" placeholder="••••••" maxlength="12">
    <div class="pw-err" id="pwErr"></div>
    <button class="btn primary" id="pwSubmit" type="button" style="width:100%;">進入</button>
  </div>
</div>

<div class="app-root" id="appRoot">
  <span class="drift d1">🌸</span><span class="drift d2">🍄</span><span class="drift d3">🍃</span><span class="drift d4">✨</span>

  <div class="wrap">
    <div class="account-bar" id="accountBar">
      <div id="gsiButton"></div>
    </div>

    <header>
      <div class="bloom-strip"><span>🌸</span><span>🍄</span><span>🗺️</span><span>📍</span><span>✨</span></div>
      <div class="mascot">🧭</div>
      <h1>地圖手帳</h1>
      <p class="sub">上傳明信片、記錄座標，追蹤你收集到的花點、菇點與隱藏點</p>
      <div class="stat-pill" id="statPill">載入中…</div>
      <div class="backend-hint" id="backendHint"></div>
    </header>

    <div class="controls">
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5C7B6A" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="搜尋關鍵字、國家、地點說明或座標…">
      </div>
      <div class="filter-bar" id="catFilters">
        <button class="chip active" data-cat="all">🌈 全部</button>
        <button class="chip" data-cat="flower">🌸 花點</button>
        <button class="chip" data-cat="mushroom">🍄 菇點</button>
        <button class="chip" data-cat="hidden">✨ 隱藏點</button>
      </div>
      <div class="filter-bar" id="obtainedFilters">
        <button class="chip active" data-obt="all">全部狀態</button>
        <button class="chip" data-obt="got">✅ 已取得</button>
        <button class="chip" data-obt="not">⭕ 未取得</button>
        <button class="chip" data-obt="expired">已絕版</button>
      </div>
      <button class="add-btn" id="openAdd" type="button">＋ 新增地點</button>
    </div>

    <div id="loadingState" class="loading">載入中…</div>
    <div class="grid" id="grid" style="display:none;"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
(function(){
  // =========================================================
  // 設定區
  // =========================================================
  const CORRECT_PASSWORD = '130807';

  // Google Apps Script 網頁應用程式網址（結尾 /exec）
  const API_URL = 'https://script.google.com/macros/s/AKfycby-YenMxweDIhbkNs8HUowGJPtvxOUuzpbVoRsTuV0QnbsA6Y6mR1nS5wRm-u9ix_nP6g/exec';

  // 管理員信箱：只有用這個 Google 帳號登入，才能勾選「沐沐已取得」
  const ADMIN_EMAIL = 'sandy36095@gmail.com';

  // Google OAuth Client ID，需跟 apps-script-backend.gs 裡的 GOOGLE_CLIENT_ID 填同一組。
  const GOOGLE_CLIENT_ID = '1001037373208-3sdt3t6aekf1v0efidd53ob62m92t2nl.apps.googleusercontent.com';

  // =========================================================
  // 密碼鎖
  // =========================================================
  const pwOverlay = document.getElementById('pwOverlay');
  const pwInput = document.getElementById('pwInput');
  const pwErr = document.getElementById('pwErr');
  const appRoot = document.getElementById('appRoot');

  function unlockApp(){
    pwOverlay.style.display = 'none';
    appRoot.style.display = 'block';
    initApp();
  }
  function tryUnlock(){
    if(pwInput.value === CORRECT_PASSWORD){
      localStorage.setItem('mapJournalAuth', '1');
      unlockApp();
    } else {
      pwErr.textContent = '密碼錯誤，請再試一次';
      pwErr.classList.remove('shake'); void pwErr.offsetWidth; pwErr.classList.add('shake');
      pwInput.value = '';
    }
  }
  document.getElementById('pwSubmit').addEventListener('click', tryUnlock);
  pwInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') tryUnlock(); });

  if(localStorage.getItem('mapJournalAuth') === '1'){
    unlockApp();
  } else {
    pwInput.focus();
  }

  // =========================================================
  // 主程式（解鎖後才會執行）
  // =========================================================
  function initApp(){
    const CATS = { flower:{label:'花點', icon:'🌸'}, mushroom:{label:'菇點', icon:'🍄'}, hidden:{label:'隱藏點', icon:'✨'} };

    const DEFAULT_KEYWORD_CATEGORIES = [
      { label:'自然景觀', words:['花朵','雪','日落','日出','天空','櫻花','森林','海灘','海','河流','瀑布','海灣','沙漠','島嶼','山','岩石','洞穴','月亮','冰','樹木','池塘','湖泊','彩虹','草地','雨','星星','銀河','太陽','海浪','極光','蘑菇','星球','太空'] },
      { label:'動物', words:['動物','狗','貓','青蛙','烏龜','馬','鹿','牛','龍','恐龍','魚','老虎','大象','鳥','鴨子','海豚','螃蟹','狐狸'] },
      { label:'建築地標', words:['咖啡館','花園','噴泉','城堡','市集','公園','神社','雕像','街頭藝術','寺廟','高塔','博物館','房子','城市','教堂','金字塔','度假村','風車','摩天輪','十字架','街道','小巷','窗戶','門','椅子','書本','壁畫'] },
      { label:'交通工具', words:['火車','火車站','橋樑','自行車','小船','巴士','纜車','汽車','飛機','熱氣球','道路','坦克'] },
      { label:'人物角色', words:['人物','卡通','動畫','彩繪','迪士尼','史努比','航海王','鬼滅之刃','寶可夢','瑪利歐','史迪奇','吉卜力','皮卡丘','小王子','公主','丘比特','童話','藝術'] },
      { label:'生活物品', words:['燈光','傳單','球','玩具','茶','咖啡','香蕉','可口可樂','販賣機','氣球','翅膀','時鐘','鞦韆'] },
      { label:'節慶活動', words:['節慶','夜景','運動','游泳池','生日','愛','愛心','生日快樂','煙火'] }
    ];
    let KEYWORD_CATEGORIES = DEFAULT_KEYWORD_CATEGORIES;

    // 試著從試算表的「關鍵字」分頁讀取，讀不到（沒建立分頁、暫存模式、網路問題）就繼續用內建清單，不影響操作
    async function loadKeywordCategories(){
      if(!API_URL) return;
      try{
        const res = await fetch(`${API_URL}?action=keywords`);
        const data = await res.json();
        if(data.ok && Array.isArray(data.categories) && data.categories.length > 0){
          KEYWORD_CATEGORIES = data.categories;
        }
      }catch(e){ /* 讀取失敗就沿用內建清單 */ }
    }

    function buildKeywordPanelHTML(){
      return KEYWORD_CATEGORIES.map(cat => `
        <div class="keyword-group">
          <div class="keyword-group-label">${cat.label}</div>
          ${cat.words.map(w => `<button type="button" class="keyword-chip" data-kw="${w}">${w}</button>`).join('')}
        </div>`).join('');
    }

    let posts = [];
    let obtainedMap = {}; // 僅在「暫存模式」使用
    let currentUser = null; // { email, name, idToken }

    let activeCat = 'all';
    let activeObtained = 'all';
    let searchTerm = '';

    const grid = document.getElementById('grid');
    const loadingState = document.getElementById('loadingState');
    const statPill = document.getElementById('statPill');
    const backendHint = document.getElementById('backendHint');
    const toastEl = document.getElementById('toast');
    const accountBar = document.getElementById('accountBar');

    backendHint.textContent = API_URL
      ? '🌐 已連接雲端試算表，所有裝置都會看到同一份資料'
      : '💻 尚未連接後端，目前為暫存模式（重新整理或換裝置可能會遺失）';

    function showToast(msg){
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(()=>toastEl.classList.remove('show'), 1600);
    }
    function escapeHtml(s){
      return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function isAdmin(){ return !!currentUser && currentUser.email === ADMIN_EMAIL; }

    const AUTH_ERROR_MESSAGES = {
      'no-token': '請先用管理員帳號登入',
      'invalid-token': '登入已過期，請重新登入一次',
      'client-mismatch': 'Client ID 跟後端設定不一致，請確認兩邊填的是同一組，並重新部署後端',
      'email-not-verified': '這個 Google 帳號的信箱尚未驗證',
      'wrong-account': '這個帳號不是管理員帳號',
      'not found': '找不到這筆資料，可能已被刪除'
    };
    function authErrorMessage(code, fallback){
      return AUTH_ERROR_MESSAGES[code] || fallback || '操作失敗，請稍後再試';
    }
    // 管理員操作被後端拒絕、且原因是憑證無效/過期時，順手把前端也登出，讓登入按鈕重新出現
    function signOutStale(){
      currentUser = null;
      sessionStorage.removeItem('mapJournalIdToken');
      renderAccountBar();
    }

    // ---------- Google 登入 ----------
    function decodeJwt(token){
      try{
        const base64Url = token.split('.')[1];
        let base64 = base64Url.replace(/-/g,'+').replace(/_/g,'/');
        // JWT 的 base64url 片段通常不帶 padding，但 atob() 需要長度是 4 的倍數，
        // 沒補齊會直接丟例外，導致整段解碼失敗（誤判成登入過期）。這裡手動補齊。
        const pad = base64.length % 4;
        if(pad === 2) base64 += '==';
        else if(pad === 3) base64 += '=';
        else if(pad !== 0) throw new Error('invalid base64 length');
        const json = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        return JSON.parse(json);
      }catch(e){ return {}; }
    }

    function renderAccountBar(){
      if(!GOOGLE_CLIENT_ID){
        accountBar.innerHTML = `<span style="font-size:11px;color:#A6947A;">尚未設定管理員登入，目前任何人都能勾選「沐沐已取得」</span>`;
        return;
      }
      if(currentUser){
        accountBar.innerHTML = `
          <div class="account-chip">
            <div class="avatar">${escapeHtml((currentUser.name||currentUser.email||'?')[0])}</div>
            <span>${escapeHtml(currentUser.name || currentUser.email)}</span>
            ${isAdmin() ? '<span class="admin-tag">管理員</span>' : ''}
            <button id="logoutBtn" type="button">登出</button>
          </div>`;
        document.getElementById('logoutBtn').addEventListener('click', () => {
          currentUser = null;
          sessionStorage.removeItem('mapJournalIdToken');
          renderAccountBar();
          render();
        });
      } else {
        accountBar.innerHTML = `<div id="gsiButton"></div>`;
        if(window.google && google.accounts){
          google.accounts.id.renderButton(document.getElementById('gsiButton'), { theme:'outline', size:'medium', shape:'pill', text:'signin' });
        }
      }
    }

    function handleCredentialResponse(response){
      const payload = decodeJwt(response.credential);
      currentUser = { email: payload.email, name: payload.name, idToken: response.credential };
      sessionStorage.setItem('mapJournalIdToken', response.credential);
      renderAccountBar();
      render();
    }
    window.__mapJournalCredentialHandler = handleCredentialResponse;

    function initGoogleSignIn(){
      if(!GOOGLE_CLIENT_ID) { renderAccountBar(); return; }
      const savedToken = sessionStorage.getItem('mapJournalIdToken');
      if(savedToken){
        const payload = decodeJwt(savedToken);
        if(payload.exp && payload.exp * 1000 > Date.now()){
          currentUser = { email: payload.email, name: payload.name, idToken: savedToken };
        } else {
          sessionStorage.removeItem('mapJournalIdToken');
        }
      }
      const trySetup = () => {
        if(window.google && google.accounts && google.accounts.id){
          google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredentialResponse });
          renderAccountBar();
        } else {
          setTimeout(trySetup, 200);
        }
      };
      trySetup();
    }

    // ---------- data loading ----------
    async function loadPosts(){
      if(API_URL){
        try{
          const res = await fetch(`${API_URL}?action=list`);
          const data = await res.json();
          if(data.ok) posts = data.posts;
        }catch(e){ showToast('讀取失敗，請檢查後端網址'); posts = []; }
      } else {
        try{
          const p = await window.storage.get('postcards', true);
          posts = p && p.value ? JSON.parse(p.value) : [];
        }catch(e){ posts = []; }
        try{
          const o = await window.storage.get('obtained-status', false);
          obtainedMap = o && o.value ? JSON.parse(o.value) : {};
        }catch(e){ obtainedMap = {}; }
        posts.forEach(p => { p.obtained = !!obtainedMap[p.id]; });
      }
      loadingState.style.display = 'none';
      grid.style.display = 'grid';
      render();
    }
    async function savePostsLocal(){
      if(API_URL) return;
      try{ await window.storage.set('postcards', JSON.stringify(posts), true); }
      catch(e){ showToast('儲存失敗，請稍後再試'); }
    }
    async function saveObtainedLocal(){
      if(API_URL) return;
      try{ await window.storage.set('obtained-status', JSON.stringify(obtainedMap), false); }
      catch(e){ showToast('儲存失敗，請稍後再試'); }
    }

    // ---------- filtering / rendering ----------
    function matchesFilters(post){
      if(activeCat !== 'all' && post.cat !== activeCat) return false;
      if(activeObtained === 'got' && !post.obtained) return false;
      if(activeObtained === 'not' && post.obtained) return false;
      if(activeObtained === 'expired' && !post.expired) return false;
      if(searchTerm){
        const hay = ((post.desc||'') + ' ' + (post.coords||'') + ' ' + (post.country||'')).toLowerCase();
        if(!hay.includes(searchTerm.toLowerCase())) return false;
      }
      return true;
    }

    function render(){
      const filtered = posts.filter(matchesFilters)
        .sort((a, b) => (a.expired ? 1 : 0) - (b.expired ? 1 : 0));
      const gotCount = posts.filter(p => p.obtained).length;
      statPill.textContent = `🌱 共 ${posts.length} 個地點・已取得 ${gotCount} 個` + (filtered.length !== posts.length ? `・顯示 ${filtered.length} 個` : '');

      if(filtered.length === 0){
        grid.innerHTML = `
          <div class="empty-state">
            <span class="emoji">${posts.length === 0 ? '🗺️' : '🔍'}</span>
            <div class="title">${posts.length === 0 ? '還沒有任何地點' : '沒有符合條件的地點'}</div>
            <div>${posts.length === 0 ? '點上方「＋ 新增地點」開始建立你的第一筆紀錄' : '試試看調整搜尋關鍵字或篩選條件'}</div>
          </div>`;
        return;
      }

      const canEditObtained = !GOOGLE_CLIENT_ID || isAdmin();

      grid.innerHTML = filtered.map((post, i) => {
        const isGot = !!post.obtained;
        const isExpired = !!post.expired;
        const statusClass = isExpired ? 'status-expired' : (isGot ? 'status-got' : 'status-pending');
        const src = post.imageUrl || post.img;
        const img = src ? `<img class="thumb" src="${src}" alt="明信片">` : `<div class="thumb-empty">🌱 未提供圖片</div>`;
        return `
        <div class="card ${statusClass}" data-id="${post.id}" style="animation-delay:${Math.min(i,8)*0.04}s">
          ${img}
          <div class="card-body">
            <div class="tag-row">
              <span class="badge ${post.cat}">${CATS[post.cat] ? CATS[post.cat].icon : ''} ${CATS[post.cat] ? CATS[post.cat].label : post.cat}</span>
              ${post.country ? `<span class="country-tag">📍 ${escapeHtml(post.country)}</span>` : ''}
              ${post.timezone ? `<span class="country-tag">🕐 <span class="local-time" data-tz="${escapeHtml(post.timezone)}">--:--</span></span>` : ''}
            </div>
            <div class="coord-box">
              <code>${escapeHtml(post.coords)}</code>
              <button class="copy-btn" data-action="copy" type="button">📋 複製</button>
            </div>
            ${post.desc ? `<p class="desc">${escapeHtml(post.desc)}</p>` : ''}
            <div class="card-footer">
              <label class="obtained-label ${isGot?'on':''} ${canEditObtained?'editable':''}">
                <input type="checkbox" data-action="toggle" data-field="obtained" ${isGot?'checked':''} ${canEditObtained?'':'disabled'}>
                ${isGot ? '✅' : ''} 沐沐已取得
              </label>
              <label class="obtained-label ${isExpired?'on':''} ${canEditObtained?'editable':''}">
                <input type="checkbox" data-action="toggle" data-field="expired" ${isExpired?'checked':''} ${canEditObtained?'':'disabled'}>
                已絕版
              </label>
              ${canEditObtained ? '<button class="edit-btn" data-action="edit" type="button">✏️ 編輯</button><button class="del-btn" data-action="delete" type="button">刪除</button>' : ''}
            </div>
          </div>
        </div>`;
      }).join('');
      updateLocalTimes();
    }

    function updateLocalTimes(){
      document.querySelectorAll('.local-time[data-tz]').forEach(el => {
        const tz = el.dataset.tz;
        try{
          const text = new Date().toLocaleString('zh-TW', {
            timeZone: tz, month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false
          });
          el.textContent = text;
        }catch(e){
          el.textContent = '--:--';
        }
      });
    }
    setInterval(updateLocalTimes, 30000);

    grid.addEventListener('click', (e) => {
      const card = e.target.closest('.card');
      if(!card) return;
      const id = card.dataset.id;
      const post = posts.find(p => String(p.id) === id);
      if(!post) return;

      if(e.target.closest('[data-action="copy"]')){
        const btn = e.target.closest('.copy-btn');
        navigator.clipboard.writeText(post.coords).then(()=>{
          showToast('已複製座標 🌱');
          const original = btn.textContent;
          btn.textContent = '已複製 ✅';
          btn.classList.add('copied');
          setTimeout(()=>{ btn.textContent = original; btn.classList.remove('copied'); }, 1400);
        });
      } else if(e.target.closest('[data-action="delete"]')){
        if(confirm('確定要刪除這個地點嗎？')) deletePost(post);
      } else if(e.target.closest('[data-action="edit"]')){
        openModal(post);
      }
    });

    grid.addEventListener('change', async (e) => {
      if(e.target.dataset.action === 'toggle'){
        const field = e.target.dataset.field === 'expired' ? 'expired' : 'obtained';
        const card = e.target.closest('.card');
        const id = card.dataset.id;
        const post = posts.find(p => String(p.id) === id);
        const newVal = e.target.checked;

        post[field] = newVal;
        render();

        if(API_URL){
          try{
            const res = await fetch(API_URL, {
              method:'POST',
              headers:{'Content-Type':'text/plain;charset=utf-8'},
              body: JSON.stringify({ action:'toggle', id, field, value:newVal, idToken: currentUser ? currentUser.idToken : '' })
            });
            const data = await res.json();
            if(!data.ok) throw new Error(data.error || 'failed');
          }catch(err){
            if(err && (err.message === 'invalid-token' || err.message === 'no-token')) signOutStale();
            showToast(authErrorMessage(err && err.message, '同步失敗，請檢查網路連線'));
            post[field] = !newVal; render();
          }
        } else if(field === 'obtained'){
          obtainedMap[id] = newVal;
          await saveObtainedLocal();
        } else {
          await savePostsLocal(); // expired 直接存在 post 物件上（跟 coords/desc 一樣是共用資料，不是個人化狀態）
        }
      }
    });

    async function deletePost(post){
      if(API_URL){
        try{
          const res = await fetch(API_URL, {
            method:'POST',
            headers:{'Content-Type':'text/plain;charset=utf-8'},
            body: JSON.stringify({ action:'delete', id: post.id, idToken: currentUser ? currentUser.idToken : '' })
          });
          const data = await res.json();
          if(!data.ok) throw new Error(data.error || 'failed');
        }catch(e){
          if(e && (e.message === 'invalid-token' || e.message === 'no-token')) signOutStale();
          showToast(authErrorMessage(e && e.message, '刪除失敗，請稍後再試'));
          return;
        }
      } else {
        delete obtainedMap[post.id];
        await saveObtainedLocal();
      }
      posts = posts.filter(p => p.id !== post.id);
      if(!API_URL) await savePostsLocal();
      render();
    }

    document.getElementById('catFilters').addEventListener('click', (e) => {
      const btn = e.target.closest('.chip');
      if(!btn) return;
      activeCat = btn.dataset.cat;
      document.querySelectorAll('#catFilters .chip').forEach(p => p.classList.toggle('active', p===btn));
      render();
    });

    document.getElementById('obtainedFilters').addEventListener('click', (e) => {
      const btn = e.target.closest('.chip');
      if(!btn) return;
      activeObtained = btn.dataset.obt;
      document.querySelectorAll('#obtainedFilters .chip').forEach(p => p.classList.toggle('active', p===btn));
      render();
    });

    let searchDebounce;
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(()=>{ searchTerm = e.target.value.trim(); render(); }, 150);
    });

    // ---------- add / edit modal ----------
    const modalRoot = document.getElementById('modalRoot');
    let pendingImg = null;
    let pendingCat = 'flower';
    let rawImageDataUrl = null;
    let cropRect = {x:0,y:0,w:0,h:0};
    let cropDisplayW = 0, cropDisplayH = 0, cropNaturalW = 0, cropNaturalH = 0;
    let cropHandlersBound = false;
    let editingPostId = null;
    let pendingTimezone = null;
    let lastTzCoords = null;

    function openModal(existingPost){
      pendingImg = null;
      pendingCat = existingPost ? existingPost.cat : 'flower';
      rawImageDataUrl = null;
      cropHandlersBound = false;
      editingPostId = existingPost ? existingPost.id : null;
      pendingTimezone = existingPost ? (existingPost.timezone || null) : null;
      lastTzCoords = existingPost ? (existingPost.coords || null) : null; // 編輯時座標沒改就不重查時區
      const existingImageSrc = existingPost ? (existingPost.imageUrl || existingPost.img || '') : '';

      modalRoot.innerHTML = `
      <div class="overlay" id="overlay">
        <div class="modal">
          <h2>${existingPost ? '✏️ 編輯地點' : '🌱 新增地點'}</h2>
          <p class="sub">${existingPost ? '修改這個地點的資訊，圖片沒換就會保留原本的' : '上傳明信片，記下座標與說明'}</p>
          <div id="draftBanner"></div>

          <div class="field">
            <label>明信片圖片（選填）</label>
            <div class="upload-box" id="uploadBox">
              ${existingImageSrc
                ? `<img src="${existingImageSrc}" alt="目前圖片"><input type="file" accept="image/*" id="imgInput">`
                : `<span id="uploadHint">📷 點擊或拖曳圖片到這裡上傳</span><input type="file" accept="image/*" id="imgInput">`}
            </div>
            <button type="button" class="recrop-btn" id="recropBtn">✂️ 重新裁剪</button>

            <div class="crop-stage" id="cropStage" style="display:none;">
              <div class="crop-wrap" id="cropWrap">
                <img id="cropImg" draggable="false" alt="裁剪預覽">
                <div class="crop-box" id="cropBox">
                  <div class="crop-handle" data-corner="nw"></div>
                  <div class="crop-handle" data-corner="ne"></div>
                  <div class="crop-handle" data-corner="sw"></div>
                  <div class="crop-handle" data-corner="se"></div>
                </div>
              </div>
              <div class="crop-hint" id="cropHint">拖曳框線調整範圍，或直接在圖片上拖曳畫出新的框選區</div>
              <div class="crop-actions">
                <button type="button" id="cropResetBtn" class="btn ghost" style="flex:0 0 auto;">重設</button>
                <button type="button" id="cropSkipBtn" class="btn ghost">使用原圖</button>
                <button type="button" id="cropApplyBtn" class="btn primary">✂️ 完成裁剪</button>
              </div>
            </div>
          </div>

          <div class="field">
            <label>座標</label>
            <input type="text" id="coordsInput" placeholder="例如：23.5563, 121.0106" value="${escapeHtml(existingPost ? existingPost.coords || '' : '')}">
            <div class="hint">貼上遊戲內複製的座標即可；離開輸入框後會自動偵測國家與當地時區</div>
            <div class="hint" id="tzHint">${existingPost && existingPost.timezone ? `🕐 目前時區：${escapeHtml(existingPost.timezone)}` : ''}</div>
          </div>

          <div class="field">
            <label>國家（自動偵測，可手動修改）</label>
            <div class="country-field-row">
              <input type="text" id="countryInput" placeholder="輸入座標後自動帶出" value="${escapeHtml(existingPost ? existingPost.country || '' : '')}">
              <span class="country-spinner" id="countrySpinner">偵測中…</span>
            </div>
          </div>

          <div class="field">
            <label>類型</label>
            <div class="cat-choice" id="catChoice">
              <button type="button" data-cat="flower">🌸 花點</button>
              <button type="button" data-cat="mushroom">🍄 菇點</button>
              <button type="button" data-cat="hidden">✨ 隱藏點</button>
            </div>
          </div>

          <div class="field">
            <label>說明 / 關鍵字（選填）</label>
            <textarea id="descInput" placeholder="例如：公園入口右側、限定花色…">${escapeHtml(existingPost ? existingPost.desc || '' : '')}</textarea>
            <button type="button" class="keyword-toggle" id="keywordToggle">
              <span id="keywordToggleIcon">▸</span> 關鍵字選項
            </button>
            <div class="keyword-panel" id="keywordPanel" style="display:none;">
              ${buildKeywordPanelHTML()}
            </div>
          </div>

          <div class="err" id="formErr"></div>

          <div class="modal-actions">
            <button class="btn ghost" id="cancelBtn" type="button">取消</button>
            <button class="btn primary" id="submitBtn" type="button">${existingPost ? '儲存修改' : '新增地點'}</button>
          </div>
        </div>
      </div>`;

      document.querySelectorAll('#catChoice button').forEach(b => b.classList.toggle('sel', b.dataset.cat === pendingCat));

      if(existingImageSrc){
        document.getElementById('recropBtn').style.display = 'none'; // 既有圖片要換新的才能裁剪
      }

      document.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id === 'overlay') attemptCloseModal(); });
      document.getElementById('cancelBtn').addEventListener('click', attemptCloseModal);

      document.getElementById('catChoice').addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if(!btn) return;
        pendingCat = btn.dataset.cat;
        document.querySelectorAll('#catChoice button').forEach(b => b.classList.toggle('sel', b===btn));
        saveDraft();
      });

      document.getElementById('imgInput').addEventListener('change', handleImgSelect);
      document.getElementById('coordsInput').addEventListener('blur', () => {
        detectCountry();
        detectTimezone();
      });
      document.getElementById('submitBtn').addEventListener('click', submitPost);
      document.getElementById('cropApplyBtn').addEventListener('click', () => finalizeFromRect(cropRect));
      document.getElementById('cropSkipBtn').addEventListener('click', async () => {
        try{ pendingImg = await compressDataUrl(rawImageDataUrl); }
        catch(e){ pendingImg = rawImageDataUrl; }
        finishImageStage();
      });
      document.getElementById('cropResetBtn').addEventListener('click', () => {
        cropRect = {x:0, y:0, w:cropDisplayW, h:cropDisplayH};
        updateCropBoxUI();
      });
      document.getElementById('keywordToggle').addEventListener('click', () => {
        const panel = document.getElementById('keywordPanel');
        const icon = document.getElementById('keywordToggleIcon');
        const isOpen = panel.style.display !== 'none';
        panel.style.display = isOpen ? 'none' : 'block';
        icon.textContent = isOpen ? '▸' : '▾';
        if(!isOpen) refreshKeywordChipStates();
      });
      document.getElementById('keywordPanel').addEventListener('click', (e) => {
        const chip = e.target.closest('.keyword-chip');
        if(!chip) return;
        toggleKeywordTag(chip.dataset.kw);
      });
      let draftDebounce;
      document.querySelector('.modal').addEventListener('input', () => {
        clearTimeout(draftDebounce);
        draftDebounce = setTimeout(saveDraft, 400);
      });
      if(!existingPost) maybeRestoreDraft();
    }

    function toggleKeywordTag(kw){
      const descEl = document.getElementById('descInput');
      if(!descEl) return;
      const tag = '#' + kw;
      const tokens = descEl.value.split(/\s+/).filter(Boolean);
      const idx = tokens.indexOf(tag);
      if(idx > -1) tokens.splice(idx, 1);
      else tokens.push(tag);
      descEl.value = tokens.join(' ');
      refreshKeywordChipStates();
      saveDraft();
    }

    function refreshKeywordChipStates(){
      const descEl = document.getElementById('descInput');
      if(!descEl) return;
      const tokens = new Set(descEl.value.split(/\s+/).filter(Boolean));
      document.querySelectorAll('.keyword-chip').forEach(chip => {
        chip.classList.toggle('selected', tokens.has('#' + chip.dataset.kw));
      });
    }

    function closeModal(){ modalRoot.innerHTML = ''; }

    function hasUnsavedChanges(){
      const coordsEl = document.getElementById('coordsInput');
      const countryEl = document.getElementById('countryInput');
      const descEl = document.getElementById('descInput');
      if(!coordsEl) return false;
      const coords = coordsEl.value.trim();
      const country = countryEl ? countryEl.value.trim() : '';
      const desc = descEl ? descEl.value.trim() : '';
      if(editingPostId){
        const orig = posts.find(p => p.id === editingPostId) || {};
        return coords !== (orig.coords||'') || country !== (orig.country||'') || desc !== (orig.desc||'') || pendingCat !== (orig.cat||'flower') || !!pendingImg;
      }
      return !!(coords || country || desc || pendingImg);
    }

    function attemptCloseModal(){
      if(hasUnsavedChanges()){
        if(!confirm('你有尚未送出的內容，確定要放棄嗎？')) return;
      }
      closeModal();
    }

    // ---------- 草稿（僅限「新增地點」，避免跟編輯中的原始資料混在一起） ----------
    function saveDraft(){
      if(editingPostId) return;
      const coordsEl = document.getElementById('coordsInput');
      if(!coordsEl) return;
      const coords = coordsEl.value.trim();
      const country = document.getElementById('countryInput').value.trim();
      const desc = document.getElementById('descInput').value.trim();
      if(!coords && !country && !desc && !pendingImg){
        localStorage.removeItem('mapJournalDraft');
        return;
      }
      try{
        localStorage.setItem('mapJournalDraft', JSON.stringify({
          coords, country, desc, cat: pendingCat, img: pendingImg || null, savedAt: Date.now()
        }));
      }catch(e){ /* 儲存失敗（可能圖片太大）就不強求，不影響操作 */ }
    }

    function maybeRestoreDraft(){
      let draft;
      try{ draft = JSON.parse(localStorage.getItem('mapJournalDraft') || 'null'); }
      catch(e){ draft = null; }
      if(!draft) return;
      const hasContent = draft.coords || draft.country || draft.desc || draft.img;
      if(!hasContent) return;

      document.getElementById('coordsInput').value = draft.coords || '';
      document.getElementById('countryInput').value = draft.country || '';
      document.getElementById('descInput').value = draft.desc || '';
      if(draft.cat){
        pendingCat = draft.cat;
        document.querySelectorAll('#catChoice button').forEach(b => b.classList.toggle('sel', b.dataset.cat === pendingCat));
      }
      if(draft.img){
        pendingImg = draft.img;
        rawImageDataUrl = draft.img; // 草稿沒有保留原始解析度，直接把壓縮過的圖當最終圖
        const box = document.getElementById('uploadBox');
        box.innerHTML = `<img src="${pendingImg}" alt="草稿圖片預覽"><input type="file" accept="image/*" id="imgInput">`;
        document.getElementById('imgInput').addEventListener('change', handleImgSelect);
        document.getElementById('recropBtn').style.display = 'inline-block';
        document.getElementById('recropBtn').onclick = () => { if(rawImageDataUrl) openCropStage(rawImageDataUrl); };
      }

      const banner = document.getElementById('draftBanner');
      if(banner){
        banner.innerHTML = `<div class="draft-banner">📝 已還原上次未完成的草稿 <button type="button" id="clearDraftBtn">清空重寫</button></div>`;
        document.getElementById('clearDraftBtn').addEventListener('click', () => {
          localStorage.removeItem('mapJournalDraft');
          closeModal();
          openModal();
        });
      }
    }

    async function detectCountry(){
      const coordsVal = document.getElementById('coordsInput').value.trim();
      const countryInput = document.getElementById('countryInput');
      const spinner = document.getElementById('countrySpinner');
      if(!coordsVal || countryInput.value.trim()) return;
      const m = coordsVal.match(/(-?\d{1,3}(?:\.\d+)?)[,\s]+(-?\d{1,3}(?:\.\d+)?)/);
      if(!m) return;
      const lat = m[1], lon = m[2];
      spinner.classList.add('show');
      try{
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=3&accept-language=zh-TW`);
        const data = await res.json();
        if(data && data.address && data.address.country){
          countryInput.value = data.address.country;
          saveDraft();
        }
      }catch(e){ /* 偵測失敗就靜默，讓使用者自行輸入 */ }
      spinner.classList.remove('show');
    }

    async function detectTimezone(){
      const coordsVal = document.getElementById('coordsInput').value.trim();
      const tzHint = document.getElementById('tzHint');
      if(!coordsVal || coordsVal === lastTzCoords) return; // 座標沒變就不重複打 API
      const m = coordsVal.match(/(-?\d{1,3}(?:\.\d+)?)[,\s]+(-?\d{1,3}(?:\.\d+)?)/);
      if(!m) return;
      const lat = m[1], lon = m[2];
      lastTzCoords = coordsVal;
      if(tzHint) tzHint.textContent = '🕐 偵測時區中…';
      try{
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=auto`);
        const data = await res.json();
        if(data && data.timezone){
          pendingTimezone = data.timezone;
          if(tzHint) tzHint.textContent = `🕐 目前時區：${pendingTimezone}`;
          saveDraft();
        } else if(tzHint){
          tzHint.textContent = '';
        }
      }catch(e){
        if(tzHint) tzHint.textContent = '';
      }
    }

    function handleImgSelect(e){
      const file = e.target.files[0];
      if(!file) return;
      const errEl = document.getElementById('formErr');
      errEl.textContent = '';
      const reader = new FileReader();
      reader.onload = function(ev){
        rawImageDataUrl = ev.target.result;
        openCropStage(rawImageDataUrl);
      };
      reader.onerror = function(){ errEl.textContent = '圖片讀取失敗，請換一張試試'; };
      reader.readAsDataURL(file);
    }

    function openCropStage(dataUrl){
      const uploadBox = document.getElementById('uploadBox');
      const recropBtn = document.getElementById('recropBtn');
      const stage = document.getElementById('cropStage');
      uploadBox.style.display = 'none';
      recropBtn.style.display = 'none';
      stage.style.display = 'block';

      const cropImg = document.getElementById('cropImg');
      cropImg.onload = function(){
        cropNaturalW = cropImg.naturalWidth;
        cropNaturalH = cropImg.naturalHeight;
        requestAnimationFrame(() => {
          cropDisplayW = cropImg.clientWidth;
          cropDisplayH = cropImg.clientHeight;
          cropRect = {x:0, y:0, w:cropDisplayW, h:cropDisplayH};
          updateCropBoxUI();
        });
      };
      cropImg.src = dataUrl;
      setupCropHandlers();
    }

    function updateCropBoxUI(){
      const box = document.getElementById('cropBox');
      if(!box) return;
      box.style.left = cropRect.x + 'px';
      box.style.top = cropRect.y + 'px';
      box.style.width = cropRect.w + 'px';
      box.style.height = cropRect.h + 'px';
    }

    function setupCropHandlers(){
      if(cropHandlersBound) return;
      cropHandlersBound = true;
      const wrap = document.getElementById('cropWrap');
      const box = document.getElementById('cropBox');

      let mode = null; // 'move' | 'resize' | 'new'
      let corner = null;
      let startPointer = {x:0,y:0};
      let startRect = {x:0,y:0,w:0,h:0};

      function getPos(e){
        const r = wrap.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }

      box.addEventListener('pointerdown', (e) => {
        mode = e.target.classList.contains('crop-handle') ? 'resize' : 'move';
        corner = e.target.dataset.corner || null;
        startPointer = getPos(e);
        startRect = {...cropRect};
        wrap.setPointerCapture(e.pointerId);
        e.stopPropagation();
      });

      wrap.addEventListener('pointerdown', (e) => {
        if(mode) return;
        mode = 'new';
        const p = getPos(e);
        startPointer = p;
        cropRect = {x:p.x, y:p.y, w:0, h:0};
        updateCropBoxUI();
        wrap.setPointerCapture(e.pointerId);
      });

      wrap.addEventListener('pointermove', (e) => {
        if(!mode) return;
        const p = getPos(e);
        if(mode === 'move'){
          let nx = startRect.x + (p.x - startPointer.x);
          let ny = startRect.y + (p.y - startPointer.y);
          nx = Math.max(0, Math.min(nx, cropDisplayW - startRect.w));
          ny = Math.max(0, Math.min(ny, cropDisplayH - startRect.h));
          cropRect = {x:nx, y:ny, w:startRect.w, h:startRect.h};
        } else if(mode === 'resize'){
          let {x,y,w,h} = startRect;
          const dx = p.x - startPointer.x;
          const dy = p.y - startPointer.y;
          if(corner === 'se'){ w = startRect.w + dx; h = startRect.h + dy; }
          else if(corner === 'sw'){ x = startRect.x + dx; w = startRect.w - dx; h = startRect.h + dy; }
          else if(corner === 'ne'){ y = startRect.y + dy; w = startRect.w + dx; h = startRect.h - dy; }
          else if(corner === 'nw'){ x = startRect.x + dx; y = startRect.y + dy; w = startRect.w - dx; h = startRect.h - dy; }
          x = Math.max(0, x); y = Math.max(0, y);
          w = Math.max(30, Math.min(w, cropDisplayW - x));
          h = Math.max(30, Math.min(h, cropDisplayH - y));
          cropRect = {x,y,w,h};
        } else if(mode === 'new'){
          let nx = Math.min(startPointer.x, p.x);
          let ny = Math.min(startPointer.y, p.y);
          let nw = Math.abs(p.x - startPointer.x);
          let nh = Math.abs(p.y - startPointer.y);
          nx = Math.max(0, nx); ny = Math.max(0, ny);
          nw = Math.min(nw, cropDisplayW - nx);
          nh = Math.min(nh, cropDisplayH - ny);
          cropRect = {x:nx, y:ny, w:nw, h:nh};
        }
        updateCropBoxUI();
      });

      function endDrag(){ mode = null; corner = null; }
      wrap.addEventListener('pointerup', endDrag);
      wrap.addEventListener('pointercancel', endDrag);
    }

    function finalizeFromRect(rect){
      finalizeFromRectAsync(rect);
    }

    async function finalizeFromRectAsync(rect){
      try{
        if(!cropDisplayW || !cropNaturalW || rect.w < 10 || rect.h < 10){
          throw new Error('crop-not-ready');
        }
        const cropImg = document.getElementById('cropImg');
        const scale = cropNaturalW / cropDisplayW;
        const sx = rect.x * scale, sy = rect.y * scale, sw = rect.w * scale, sh = rect.h * scale;
        if(!isFinite(sw) || !isFinite(sh) || sw <= 0 || sh <= 0){
          throw new Error('invalid-crop-size');
        }
        const maxW = 640;
        const destW = Math.max(1, Math.round(Math.min(sw, maxW)));
        const destH = Math.max(1, Math.round(sh * (destW / sw)));
        const canvas = document.createElement('canvas');
        canvas.width = destW; canvas.height = destH;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(cropImg, sx, sy, sw, sh, 0, 0, destW, destH);
        pendingImg = canvas.toDataURL('image/jpeg', 0.7);
      }catch(err){
        // 裁剪計算失敗時，安全退回使用完整原圖，絕不讓照片不見
        try{ pendingImg = await compressDataUrl(rawImageDataUrl); }
        catch(e2){ pendingImg = rawImageDataUrl; }
      }
      finishImageStage();
    }

    // 直接把整張原圖壓縮成可儲存的大小，供「使用原圖」與送出前的保險機制共用
    function compressDataUrl(dataUrl, maxW, quality){
      maxW = maxW || 640; quality = quality || 0.7;
      return new Promise((resolve, reject) => {
        if(!dataUrl){ reject(new Error('no-image')); return; }
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxW / img.naturalWidth);
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          try{ resolve(canvas.toDataURL('image/jpeg', quality)); }
          catch(e){ reject(e); }
        };
        img.onerror = () => reject(new Error('image-load-failed'));
        img.src = dataUrl;
      });
    }

    function finishImageStage(){
      document.getElementById('cropStage').style.display = 'none';
      const box = document.getElementById('uploadBox');
      box.style.display = 'block';
      box.innerHTML = `<img src="${pendingImg}" alt="預覽"><input type="file" accept="image/*" id="imgInput">`;
      document.getElementById('imgInput').addEventListener('change', handleImgSelect);
      const recropBtn = document.getElementById('recropBtn');
      recropBtn.style.display = 'inline-block';
      recropBtn.onclick = () => { if(rawImageDataUrl) openCropStage(rawImageDataUrl); };
      saveDraft();
    }

    async function submitPost(){
      const coords = document.getElementById('coordsInput').value.trim();
      const country = document.getElementById('countryInput').value.trim();
      const desc = document.getElementById('descInput').value.trim();
      const errEl = document.getElementById('formErr');
      if(!coords){ errEl.textContent = '請輸入座標'; return; }
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = editingPostId ? '儲存中…' : '新增中…';

      // 保險機制：如果選過圖片但因為某些原因裁剪流程沒跑完，送出前補做一次壓縮，絕不讓照片不見
      if(!pendingImg && rawImageDataUrl){
        try{ pendingImg = await compressDataUrl(rawImageDataUrl); }
        catch(e){ pendingImg = rawImageDataUrl; }
      }

      if(API_URL){
        const payload = editingPostId
          ? { action:'update', id:editingPostId, coords, country, cat:pendingCat, desc, timezone: pendingTimezone || '', idToken: currentUser ? currentUser.idToken : '' }
          : { action:'add', coords, country, cat:pendingCat, desc, timezone: pendingTimezone || '' };
        if(pendingImg) payload.image = pendingImg; // 編輯時沒換圖片就不帶這欄，後端會保留原圖
        try{
          const res = await fetch(API_URL, {
            method:'POST',
            headers:{'Content-Type':'text/plain;charset=utf-8'},
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if(!data.ok) throw new Error(data.error || 'failed');
          if(editingPostId){
            const idx = posts.findIndex(p => p.id === editingPostId);
            if(idx > -1){
              posts[idx] = { ...posts[idx], coords, country, cat:pendingCat, desc, timezone: pendingTimezone || posts[idx].timezone };
              if(data.imageUrl) posts[idx].imageUrl = data.imageUrl;
            }
          } else {
            posts.unshift({
              id: data.id, coords, country, cat:pendingCat, desc, timezone: pendingTimezone || '',
              imageUrl: data.imageUrl || '', obtained:false, expired:false, createdAt: new Date().toISOString()
            });
          }
        }catch(e){
          if(editingPostId && e && (e.message === 'invalid-token' || e.message === 'no-token')) signOutStale();
          errEl.textContent = editingPostId
            ? authErrorMessage(e && e.message, '修改失敗，請確認網路連線')
            : '新增失敗，請確認後端網址是否正確';
          submitBtn.disabled = false;
          submitBtn.textContent = editingPostId ? '儲存修改' : '新增地點';
          return;
        }
      } else if(editingPostId){
        const idx = posts.findIndex(p => p.id === editingPostId);
        if(idx > -1){
          posts[idx] = { ...posts[idx], coords, country, cat:pendingCat, desc, timezone: pendingTimezone || posts[idx].timezone, img: pendingImg || posts[idx].img };
        }
        await savePostsLocal();
      } else {
        const post = {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
          img: pendingImg, coords, country, timezone: pendingTimezone || '', cat: pendingCat, desc, createdAt: Date.now(), obtained:false
        };
        posts.unshift(post);
        await savePostsLocal();
      }

      closeModal();
      render();
      if(!editingPostId) localStorage.removeItem('mapJournalDraft');
      showToast(editingPostId ? '已更新地點 ✏️' : '已新增地點 🌸');
    }

    document.getElementById('openAdd').addEventListener('click', () => openModal());

    initGoogleSignIn();
    loadPosts();
    loadKeywordCategories();
  }
})();
</script>
</body>
